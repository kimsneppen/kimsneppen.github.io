<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merging &amp; Creation Networks</title>
<style>
  html,body{margin:0;background:#10141c;color:#cfd8e3;
    font-family:"Segoe UI",Arial,sans-serif}
  body{overflow-y:auto;overflow-x:hidden}
  #top{display:grid;grid-template-columns:215px 1fr;gap:4px;
    height:calc(100vh - 8px);padding:4px 4px 0;box-sizing:border-box}
  #panel{background:#1a2029;border:1px solid #2c3542;border-radius:8px;
    padding:10px;overflow-y:auto;box-sizing:border-box}
  #netbox{position:relative;background:#f7f8fa;border:1px solid #2c3542;
    border-radius:8px;overflow:hidden}
  #plotbox{background:#f7f8fa;border:1px solid #2c3542;border-radius:8px;
    overflow:hidden;height:280px;margin:4px 4px 4px 223px;box-sizing:border-box}
  canvas{display:block}
  h1{font-size:14px;margin:0 0 2px;color:#e8eef6}
  #ref{font-size:9.5px;color:#7f8ea3;margin:0 0 8px;line-height:1.4}
  .sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7f8ea3;
    margin:14px 0 5px;border-bottom:1px solid #2c3542;padding-bottom:3px}
  label{font-size:12px;display:block;margin:6px 0 2px}
  input[type=number]{width:64px;background:#0b0e14;color:#e8eef6;border:1px solid #3a4656;
    border-radius:4px;padding:3px 5px;font-size:13px}
  input[type=range]{width:100%;margin:2px 0 0}
  .val{color:#8fb6ff;font-size:11px;float:right}
  button{display:block;width:100%;margin:5px 0;padding:7px 6px;font-size:11.5px;
    background:#242d3a;color:#cfd8e3;border:1px solid #3a4656;border-radius:6px;
    cursor:pointer;text-align:left;line-height:1.3;font-family:"Segoe UI",Arial,sans-serif}
  button:hover{background:#2d3949}
  button.active{background:#1f4d8f;border-color:#4d8de0;color:#fff}
  button.run{background:#1d5c3a;border-color:#2e8a58;text-align:center;font-weight:600}
  button.run.paused{background:#6e2f2f;border-color:#a04848}
  button.reset,button.toggle{text-align:center}
  .row{display:flex;gap:3px}
  .row button{flex:1;margin:3px 0;padding:6px 0;text-align:center}
  .stat{font-size:11px;color:#9fb0c4;margin:2px 0}
  .stat b{color:#e8eef6;font-weight:600}
  @media (max-width:700px){
    body{display:flex;flex-direction:column}
    #top{display:contents}
    #netbox{order:1;height:55vh;height:55svh;min-height:280px;margin:4px 4px 0}
    #plotbox{order:2;margin:4px;height:500px}
    #panel{order:3;margin:4px;max-height:none;overflow:visible}
    input[type=number]{font-size:16px}
  }
</style>
</head>
<body>
<div id="top">
  <div id="panel">
    <h1>Merging &amp; Creation</h1>
    <div id="ref">(B.J. Kim, A. Trusina, P. Minnhagen,<br>
      K. Sneppen, <i>Self organized scale-free networks from merging and regeneration</i>,
      Eur. Phys. J. B <b>43</b>, 369 (2005))</div>
    <div class="sec">Parameters</div>
    <label>Nodes N <input id="inN" type="number" min="10" max="2000" value="800"></label>
    <label>New links k <input id="inK" type="number" min="0.5" max="10" step="0.1" value="4"></label>
    <button class="reset" id="btnReset">Reseed (Erd&#337;s&ndash;R&eacute;nyi)</button>

    <div class="sec">Model</div>
    <button class="mode active" id="m0">Neighbor merging,<br>random creation</button>
    <button class="mode" id="m1">Foreign merging,<br>random creation</button>
    <button class="mode" id="m2">Neighbor merging,<br>weighted creation</button>

    <div class="sec">Run</div>
    <button class="run" id="btnRun">&#9646;&#9646; Pause</button>
    <label>Speed <span class="val" id="vSpeed"></span>
      <input id="sSpeed" type="range" min="0" max="100" step="0.5" value="72.5"></label>

    <div class="sec">Node size</div>
    <div class="row" id="sizeRow">
      <button data-s="0.5">&frac12;</button>
      <button data-s="1" class="active">1</button>
      <button data-s="2">2</button>
      <button data-s="3">3</button>
      <button data-s="25">25</button>
    </div>
    <button class="toggle" id="btnVol">Volume &prop; k</button>

    <div class="sec">Layout</div>
    <label>Repulsion k&#8321;k&#8322;/d&sup3; <span class="val" id="vRep"></span>
      <input id="sRep" type="range" min="0" max="100" value="35"></label>
    <label>Angle widening <span class="val" id="vAng"></span>
      <input id="sAng" type="range" min="0" max="100" value="40"></label>
    <label>Damping <span class="val" id="vDamp"></span>
      <input id="sDamp" type="range" min="0" max="100" value="60"></label>
    <label>Rotation <span class="val" id="vRot"></span>
      <input id="sRot" type="range" min="0" max="100" value="12"></label>

    <div class="sec">Appearance</div>
    <label>Link width <span class="val" id="vLw"></span>
      <input id="sLw" type="range" min="15" max="200" value="30"></label>
    <label>Opacity <span class="val" id="vTr"></span>
      <input id="sTr" type="range" min="0" max="100" value="70"></label>
    <button class="toggle" id="btnGlow">Afterglow: OFF</button>
    <button class="toggle active" id="btnBg">Background: WHITE</button>

    <div class="sec">Export</div>
    <button class="toggle" id="btnPngNet">Save network .png</button>
    <button class="toggle" id="btnPngPlot">Save histogram .png</button>
    <button class="toggle" id="btnPngBoth">Save both .png</button>

    <div class="sec">Status</div>
    <div class="stat">step: <b id="stT">0</b></div>
    <div class="stat">nodes: <b id="stN">0</b>&nbsp; links: <b id="stE">0</b></div>
    <div class="stat">&lt;k&gt;: <b id="stAvg">0</b>&nbsp; k<sub>max</sub>: <b id="stMax">0</b></div>
    <div class="stat">fit: <b id="stFit">&ndash;</b></div>
  </div>
  <div id="netbox"><canvas id="net"></canvas></div>
</div>
<div id="plotbox"><canvas id="plot"></canvas></div>

<script>
"use strict";
/* ================= model =================
   Kim, Trusina, Minnhagen, Sneppen, Eur. Phys. J. B 43, 369 (2005)
   Steady-state network: merge two nodes, add one new node with k links. */

let N = 800, K = 4;
let mode = 0;                 // 0 nbr+random, 1 foreign+random, 2 nbr+weighted
let nodes = [];               // {id,x,y,z,nb:Set}
let nodeById = new Map();
let nextId = 0;
let step = 0;
let running = true;
let glows = [];               // red afterglows {x,y,z,r,a}
let glowOn = false;

/* time-averaged distribution over last 3/4: cumulative histogram + checkpoints */
const HMAX = 4096;
let cumHist = new Float64Array(HMAX);
let snaps = [];
const SNAP = 25;

/* traces of the 3 largest degrees vs time */
let trAll1=[], trAll2=[], trAll3=[], trStride=1;
let trA1=0, trA2=0, trA3=0, trAccN=0;
const TRLIMIT=4000;
let ringSize=16000, ring1, ring2, ring3, ringPos=0, ringLen=0;
let traceMode=0;              // 0: all time, 1: last 20*N steps
let traceBtnRect=[0,0,0,0];

function rnd(n){ return Math.floor(Math.random()*n); }
/* fractional k: floor(k) links plus one more with probability frac(k) */
function drawK(){
  const f=Math.floor(K);
  return f + (Math.random()<K-f ? 1 : 0);
}

function makeNode(x,y,z){
  const nd = {id:nextId++, x:x, y:y, z:z, nb:new Set()};
  nodes.push(nd); nodeById.set(nd.id, nd);
  return nd;
}
function link(a,b){ if(a!==b){ a.nb.add(b.id); b.nb.add(a.id); } }

function seed(){
  nodes = []; nodeById.clear(); nextId = 0; step = 0; glows = [];
  cumHist = new Float64Array(HMAX); snaps = [];
  trAll1=[]; trAll2=[]; trAll3=[]; trStride=1; trA1=trA2=trA3=0; trAccN=0;
  ringSize=Math.max(100, 20*N);               // "last 20*N steps" window
  ring1=new Float32Array(ringSize); ring2=new Float32Array(ringSize); ring3=new Float32Array(ringSize);
  ringPos=0; ringLen=0;
  const R = 240;
  for(let i=0;i<N;i++){                       // random points in a ball
    let x,y,z;
    do{ x=(2*Math.random()-1); y=(2*Math.random()-1); z=(2*Math.random()-1); }
    while(x*x+y*y+z*z>1);
    makeNode(R*x, R*y, R*z);
  }
  const p = K/(N-1);                          // ER with <k> = K
  for(let i=0;i<N;i++) for(let j=i+1;j<N;j++)
    if(Math.random()<p) link(nodes[i],nodes[j]);
}

function randomNode(){ return nodes[rnd(nodes.length)]; }
function randomNodeWithLink(){
  for(let t=0;t<200;t++){ const n=randomNode(); if(n.nb.size>0) return n; }
  return null;
}
function edgeList(){
  const E=[];
  for(const n of nodes) for(const id of n.nb) if(id>n.id) E.push([n,nodeById.get(id)]);
  return E;
}

function merge(a,b){
  let s=a, t=b;
  if(b.nb.size>a.nb.size){ s=b; t=a; }        // survivor = larger degree
  if(glowOn) glows.push({x:t.x, y:t.y, z:t.z, r:radius(t.nb.size)+6, a:1});
  for(const id of t.nb){
    const u=nodeById.get(id);
    u.nb.delete(t.id);
    if(u!==s){ u.nb.add(s.id); s.nb.add(u.id); }
  }
  s.nb.delete(t.id);
  nodeById.delete(t.id);
  nodes.splice(nodes.indexOf(t),1);
  return s;
}

function addNewNode(weighted){
  const kk = Math.min(drawK(), nodes.length);
  const targets = new Set();
  if(weighted){
    const E = edgeList();                     // random link, random end: p ~ degree
    let tries=0;
    while(targets.size<kk && tries++<400 && E.length){
      const e=E[rnd(E.length)];
      targets.add(Math.random()<0.5 ? e[0] : e[1]);
    }
  }
  while(targets.size<kk) targets.add(randomNode());
  let cx=0, cy=0, cz=0;
  if(targets.size){
    for(const t of targets){ cx+=t.x; cy+=t.y; cz+=t.z; }
    cx/=targets.size; cy/=targets.size; cz/=targets.size;
  }
  const nd = makeNode(cx+(Math.random()-0.5)*40,
                      cy+(Math.random()-0.5)*40,
                      cz+(Math.random()-0.5)*40);
  for(const t of targets) link(nd,t);
}

function recordTraces(){
  let k1=0,k2=0,k3=0;
  for(const nd of nodes){
    const d=nd.nb.size;
    if(d>=k1){ k3=k2; k2=k1; k1=d; }
    else if(d>=k2){ k3=k2; k2=d; }
    else if(d>k3){ k3=d; }
  }
  ring1[ringPos]=k1; ring2[ringPos]=k2; ring3[ringPos]=k3;
  ringPos=(ringPos+1)%ringSize;
  if(ringLen<ringSize) ringLen++;
  trA1+=k1; trA2+=k2; trA3+=k3;
  if(++trAccN>=trStride){
    trAll1.push(trA1/trAccN); trAll2.push(trA2/trAccN); trAll3.push(trA3/trAccN);
    trA1=trA2=trA3=0; trAccN=0;
    if(trAll1.length>=TRLIMIT){                    // decimate, double the stride
      const m=trAll1.length>>1;
      for(let i=0;i<m;i++){
        trAll1[i]=(trAll1[2*i]+trAll1[2*i+1])/2;
        trAll2[i]=(trAll2[2*i]+trAll2[2*i+1])/2;
        trAll3[i]=(trAll3[2*i]+trAll3[2*i+1])/2;
      }
      trAll1.length=trAll2.length=trAll3.length=m;
      trStride*=2;
    }
  }
}

function modelStep(){
  if(nodes.length<3) return;
  if(mode===1){
    const a=randomNode(); let b=randomNode(), t=0;
    while(b===a && t++<50) b=randomNode();
    if(a!==b) merge(a,b);
  }else{
    const a=randomNodeWithLink();
    if(!a) return;
    const ids=[...a.nb];
    merge(a, nodeById.get(ids[rnd(ids.length)]));
  }
  addNewNode(mode===2);
  step++;
  for(const n of nodes){ const d=Math.min(n.nb.size,HMAX-1); cumHist[d]++; }
  if(step%SNAP===0) snaps.push({t:step, cum:cumHist.slice()});
  recordTraces();
}

/* ============== node size ============== */

let sizeMult = 1;
let volMode = 0;              // 0: volume ~ k (r ~ k^1/3);  1: volume ~ sqrt(k) (r ~ k^1/6)
function radius(deg){
  const k=Math.max(deg,1);
  return 4.5*sizeMult*(volMode ? Math.pow(k,1/6) : Math.cbrt(k));
}

/* ============== theme ============== */

let lightBg = true;
function bgArr(){ return lightBg ? [247,248,250] : [11,14,20]; }
function bgCss(){ return lightBg ? '#f7f8fa' : '#0b0e14'; }
function linkCol(){
  return lightBg
    ? {body:'#a51d1d', core:'#ff8a75', cone:'#c22525'}      // red on white
    : {body:'#b89f14', core:'#ffef8f', cone:'#e0c928'};     // yellow on black
}
function plotTheme(){
  return lightBg
    ? {grid:'#c9cfd8', txt:'#556070', fit:'#39424e', cur:'#2f6ad0', avg:'#c04818', leg:'#333c48',
       k1:'#6a7280', k1fill:'rgba(120,128,140,0.18)', k2:'#2f6ad0', k3:'#1f8a4d'}
    : {grid:'#2c3542', txt:'#7f8ea3', fit:'#dfe7f2', cur:'#6aa7f8', avg:'#e08a2e', leg:'#cfd8e3',
       k1:'#c8cdd6', k1fill:'rgba(200,205,214,0.20)', k2:'#6aa7f8', k3:'#5fc98a'};
}
const FONT='"Segoe UI",Arial,sans-serif';    // same font as control panel

/* ============== 3D layout: overdamped Kamada-Kawai-style relaxation ============== */

const netC = document.getElementById('net'), nctx = netC.getContext('2d');
const plotC = document.getElementById('plot'), pctx = plotC.getContext('2d');
let W=800, H=600, PW=800, PH=280, DPR=1;

function resize(){
  const nb=document.getElementById('netbox'), pb=document.getElementById('plotbox');
  DPR = window.devicePixelRatio||1;
  W=nb.clientWidth;  H=nb.clientHeight;
  PW=pb.clientWidth; PH=pb.clientHeight;
  netC.width=Math.round(W*DPR);   netC.height=Math.round(H*DPR);
  netC.style.width=W+'px';        netC.style.height=H+'px';
  plotC.width=Math.round(PW*DPR); plotC.height=Math.round(PH*DPR);
  plotC.style.width=PW+'px';      plotC.style.height=PH+'px';
}
window.addEventListener('resize', resize);

let repC = 35, angC = 40, speed = 800, rotC = 12, dampC = 60, lwC = 30, trC = 70;

function relax(){
  const n = nodes.length; if(!n) return;
  const fx=new Float64Array(n), fy=new Float64Array(n), fz=new Float64Array(n);
  const idx = new Map(); nodes.forEach((nd,i)=>idx.set(nd.id,i));
  const L0 = 46;

  // springs along links
  for(let i=0;i<n;i++){
    const a=nodes[i];
    for(const id of a.nb){ if(id<a.id) continue;
      const b=nodeById.get(id), j=idx.get(id);
      const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
      const d=Math.hypot(dx,dy,dz)||1e-6;
      const ideal = L0 + radius(a.nb.size) + radius(b.nb.size);
      const f = 0.06*(d-ideal)/d;
      fx[i]+=f*dx; fy[i]+=f*dy; fz[i]+=f*dz;
      fx[j]-=f*dx; fy[j]-=f*dy; fz[j]-=f*dz;
    }
  }
  // node-node repulsion  C * k1*k2 / d^3
  const C = 12*repC;
  if(C>0) for(let i=0;i<n;i++){
    const a=nodes[i], ka=a.nb.size||0.5;
    for(let j=i+1;j<n;j++){
      const b=nodes[j], kb=b.nb.size||0.5;
      const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
      let d2=dx*dx+dy*dy+dz*dz; if(d2<25) d2=25;
      const d=Math.sqrt(d2);
      let f = C*ka*kb/(d2*d);
      if(f>4) f=4;
      const ux=dx/d, uy=dy/d, uz=dz/d;
      fx[i]-=f*ux; fy[i]-=f*uy; fz[i]-=f*uz;
      fx[j]+=f*ux; fy[j]+=f*uy; fz[j]+=f*uz;
    }
  }
  // angle widening: repel neighbors of the same hub from each other
  if(angC>0){
    const A = 0.05*angC;
    for(const h of nodes){
      const deg=h.nb.size; if(deg<2) continue;
      const nbs=[...h.nb];
      const nPairs = Math.min(deg*(deg-1)/2, 3*deg);   // sample pairs on big hubs
      for(let s=0;s<nPairs;s++){
        let ia=rnd(deg), ib=rnd(deg);
        if(ia===ib) continue;
        const u=nodeById.get(nbs[ia]), v=nodeById.get(nbs[ib]);
        const i=idx.get(u.id), j=idx.get(v.id);
        const dx=v.x-u.x, dy=v.y-u.y, dz=v.z-u.z;
        const d2=dx*dx+dy*dy+dz*dz+100;
        let f=A*L0*L0/(d2*Math.sqrt(d2));
        if(f>1.5) f=1.5;
        fx[i]-=f*dx; fy[i]-=f*dy; fz[i]-=f*dz;
        fx[j]+=f*dx; fy[j]+=f*dy; fz[j]+=f*dz;
      }
    }
  }
  // gentle centering + overdamped move, mobility set by damping slider
  let cx=0, cy=0, cz=0;
  for(const nd of nodes){ cx+=nd.x; cy+=nd.y; cz+=nd.z; }
  cx/=n; cy/=n; cz/=n;
  const mob = Math.max(0.05, 1.05 - dampC/100);
  for(let i=0;i<n;i++){
    let mx=fx[i]-0.002*cx, my=fy[i]-0.002*cy, mz=fz[i]-0.002*cz;
    const m=Math.hypot(mx,my,mz), cap=6;
    if(m>cap){ const s=cap/m; mx*=s; my*=s; mz*=s; }
    nodes[i].x+=mob*mx; nodes[i].y+=mob*my; nodes[i].z+=mob*mz;
  }
}

/* ============== 3D projection ============== */

let theta=0;                       // slow rotation about vertical axis
const TILT=0.32, F=1400;           // camera tilt and focal length
let vs=1;                          // smoothed view scale

function project(x,y,z,ct,st,cp,sp){
  const xr =  ct*x + st*z;
  const z1 = -st*x + ct*z;
  const yr =  cp*y - sp*z1;
  const zr =  sp*y + cp*z1;        // + : away from viewer
  const pers = F/(F+Math.max(zr,-0.8*F));
  return {sx:xr*pers, sy:yr*pers, zr:zr, pers:pers};
}

/* center of mass of all nodes */
function getCM(){
  let x=0,y=0,z=0;
  const n=nodes.length||1;
  for(const nd of nodes){ x+=nd.x; y+=nd.y; z+=nd.z; }
  return [x/n, y/n, z/n];
}

/* rescale so the network just fills the display panel, CM in the center */
function fitView(hard){
  if(!nodes.length) return;
  const ct=Math.cos(theta), st=Math.sin(theta);
  const cp=Math.cos(TILT), sp=Math.sin(TILT);
  const [cmx,cmy,cmz]=getCM();
  let mx=1, my=1;
  for(const nd of nodes){
    const p=project(nd.x-cmx,nd.y-cmy,nd.z-cmz,ct,st,cp,sp);
    const r=(radius(nd.nb.size)+8)*p.pers;
    mx=Math.max(mx,Math.abs(p.sx)+r);
    my=Math.max(my,Math.abs(p.sy)+r);
  }
  const s=Math.min(20, (W/2-4)/mx, (H/2-4)/my);
  vs += (hard?1:0.08)*(s-vs);
}

/* ============== drawing ============== */

function shade(hex,f){             // blend hex colour toward background by (1-f)
  const bg=bgArr();
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return 'rgb('+Math.round(bg[0]+(r-bg[0])*f)+','+Math.round(bg[1]+(g-bg[1])*f)+','
               +Math.round(bg[2]+(b-bg[2])*f)+')';
}

function drawNet(){
  nctx.setTransform(DPR,0,0,DPR,0,0);
  nctx.clearRect(0,0,W,H);
  nctx.setTransform(DPR,0,0,DPR,DPR*W/2,DPR*H/2);

  const ct=Math.cos(theta), st=Math.sin(theta);
  const cp=Math.cos(TILT), sp=Math.sin(TILT);
  const [cmx,cmy,cmz]=getCM();          // CM always in the center of the frame
  const P=new Map();
  let zmin=1e9, zmax=-1e9;
  for(const nd of nodes){
    const p=project(nd.x-cmx,nd.y-cmy,nd.z-cmz,ct,st,cp,sp);
    P.set(nd.id,p);
    zmin=Math.min(zmin,p.zr); zmax=Math.max(zmax,p.zr);
  }
  const zspan=Math.max(zmax-zmin,1);
  const depth=z=>0.42+0.58*(1-(z-zmin)/zspan);   // 1 near ... fades to background far

  const items=[];
  for(const a of nodes) for(const id of a.nb){ if(id<a.id) continue;
    const b=nodeById.get(id);
    items.push({z:(P.get(a.id).zr+P.get(b.id).zr)/2, t:0, a:a, b:b});
  }
  for(const g of glows){
    const p=project(g.x-cmx,g.y-cmy,g.z-cmz,ct,st,cp,sp);
    items.push({z:p.zr, t:1, g:g, p:p});
    g.a-=0.022;
  }
  glows=glows.filter(g=>g.a>0);
  for(const nd of nodes) items.push({z:P.get(nd.id).zr, t:2, n:nd});
  items.sort((u,v)=>v.z-u.z);                     // far first

  const lwMult=lwC/100, alpha=trC/100, LC=linkCol();
  nctx.lineCap='round';
  for(const it of items){
    if(it.t===0){                                 // 3D stick + translucent cones
      const a=it.a, b=it.b;
      const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
      const d3=Math.hypot(dx,dy,dz)||1;
      const ra=radius(a.nb.size)/d3, rb=radius(b.nb.size)/d3;
      const pa=project(a.x+dx*ra-cmx, a.y+dy*ra-cmy, a.z+dz*ra-cmz, ct,st,cp,sp);
      const pb=project(b.x-dx*rb-cmx, b.y-dy*rb-cmy, b.z-dz*rb-cmz, ct,st,cp,sp);
      const ax=pa.sx*vs, ay=pa.sy*vs, bx=pb.sx*vs, by=pb.sy*vs;
      const ddx=bx-ax, ddy=by-ay, dd=Math.hypot(ddx,ddy)||1e-6;
      const ux=ddx/dd, uy=ddy/dd;
      const f=depth(it.z), sc=vs*(pa.pers+pb.pers)/2;
      const lw=Math.max(0.4, 3.0*sc*lwMult);
      const coneL=Math.min(7*sc*(0.6+0.8*lwMult), 0.22*dd);
      const coneW=Math.max(0.8, 2.6*sc*lwMult);
      // cylinder illusion: dark body, then off-axis bright core
      let nx=-uy, ny=ux;                          // perpendicular, toward upper-left light
      if(nx+ny>0){ nx=-nx; ny=-ny; }
      const x1=ax+ux*coneL, y1=ay+uy*coneL;
      const x2=bx-ux*coneL, y2=by-uy*coneL;
      nctx.globalAlpha=alpha;
      nctx.strokeStyle=shade(LC.body,f);
      nctx.lineWidth=lw;
      nctx.beginPath(); nctx.moveTo(x1,y1); nctx.lineTo(x2,y2); nctx.stroke();
      nctx.strokeStyle=shade(LC.core,f);
      nctx.lineWidth=Math.max(0.3,lw*0.42);
      const off=0.22*lw;
      nctx.beginPath();
      nctx.moveTo(x1+nx*off, y1+ny*off);
      nctx.lineTo(x2+nx*off, y2+ny*off);
      nctx.stroke();
      // small semi-transparent cones pointing into the spheres
      nctx.globalAlpha=0.55*alpha;
      nctx.fillStyle=shade(LC.cone,f);
      const cone=(tx,ty,dxn,dyn)=>{
        nctx.beginPath();
        nctx.moveTo(tx,ty);
        nctx.lineTo(tx-dxn*coneL-dyn*coneW, ty-dyn*coneL+dxn*coneW);
        nctx.lineTo(tx-dxn*coneL+dyn*coneW, ty-dyn*coneL-dxn*coneW);
        nctx.closePath(); nctx.fill();
      };
      cone(ax,ay,-ux,-uy);
      cone(bx,by, ux, uy);
      nctx.globalAlpha=1;
    }else if(it.t===1){                           // red afterglow
      const g=it.g, p=it.p;
      const R=g.r*(1.6+2.2*(1-g.a))*p.pers*vs;
      const gx=p.sx*vs, gy=p.sy*vs;
      const gr=nctx.createRadialGradient(gx,gy,0,gx,gy,R);
      gr.addColorStop(0,'rgba(255,70,40,'+(0.75*g.a*depth(it.z))+')');
      gr.addColorStop(1,'rgba(255,70,40,0)');
      nctx.fillStyle=gr;
      nctx.beginPath(); nctx.arc(gx,gy,R,0,7); nctx.fill();
    }else{                                        // blue sphere, white highlight
      const nd=it.n, p=P.get(nd.id);
      const r=Math.max(1,radius(nd.nb.size)*p.pers*vs);
      const x=p.sx*vs, y=p.sy*vs, f=depth(it.z);
      nctx.save();
      nctx.globalAlpha=alpha;
      nctx.shadowColor='rgba(0,0,0,'+(0.55*f)+')';
      nctx.shadowBlur=8*f; nctx.shadowOffsetX=3; nctx.shadowOffsetY=4;
      const gr=nctx.createRadialGradient(x-0.35*r, y-0.35*r, 0.08*r, x, y, r);
      gr.addColorStop(0,  shade('#ffffff',f));
      gr.addColorStop(0.28,shade('#bcd9ff',f));
      gr.addColorStop(0.6, shade('#4f92ea',f));
      gr.addColorStop(1,  shade('#0e3269',f));
      nctx.fillStyle=gr;
      nctx.beginPath(); nctx.arc(x,y,r,0,7); nctx.fill();
      nctx.restore();
    }
  }
}

/* ---------- log-log degree distribution plot ---------- */

function currentHist(){
  const h={}; let mx=1;
  for(const nd of nodes){ const d=nd.nb.size; if(d>0){ h[d]=(h[d]||0)+1; mx=Math.max(mx,d);} }
  return {h:h, mx:mx};
}
function averagedHist(){
  if(step<8) return null;
  const t0=step*0.25;                     // average over last 3/4 of run
  let base=null;
  for(const s of snaps){ if(s.t<=t0) base=s; else break; }
  const bt=base?base.t:0, bc=base?base.cum:null;
  const span=step-bt; if(span<=0) return null;
  const h={}; let mx=1;
  for(let d=1;d<HMAX;d++){
    const v=cumHist[d]-(bc?bc[d]:0);
    if(v>0){ h[d]=v/span; mx=Math.max(mx,d); }
  }
  return {h:h, mx:mx};
}

/* least-squares power-law fit of averaged P(k), k in [5, kmax/10) */
function fitPowerLaw(avg,n){
  const lo=5;
  let hi=avg.mx/10;
  let ks=Object.keys(avg.h).map(Number).filter(k=>k>=lo&&k<hi);
  if(ks.length<4){ hi=avg.mx; ks=Object.keys(avg.h).map(Number).filter(k=>k>=lo&&k<hi); }
  if(ks.length<4) return null;
  let sx=0,sy=0,sxx=0,sxy=0;
  for(const k of ks){
    const x=Math.log(k), y=Math.log(avg.h[k]/n);
    sx+=x; sy+=y; sxx+=x*x; sxy+=x*y;
  }
  const m=ks.length;
  const slope=(m*sxy-sx*sy)/(m*sxx-sx*sx);
  const icpt=(sy-slope*sx)/m;
  return {slope:slope, icpt:icpt, lo:lo, hi:hi};
}

function drawPlot(){
  const w=PW, hgt=PH;
  const T=plotTheme();
  pctx.setTransform(DPR,0,0,DPR,0,0);
  pctx.setLineDash([]);
  pctx.clearRect(0,0,w,hgt);
  const stacked = w<560;                        // phones: two panels stacked
  const hp = stacked ? Math.floor(hgt/2) : hgt; // height of one panel
  const hw = stacked ? w : Math.floor(w/2);

  /* ===== left half: log-log degree distribution ===== */
  const ml=72, mr=14, mt=16, mb=44;
  const pw=hw-ml-mr, ph=hp-mt-mb;
  const cur=currentHist(), avg=averagedHist();
  const n=nodes.length||1;

  let kmax=cur.mx; if(avg) kmax=Math.max(kmax,avg.mx);
  const lxmax=Math.log10(Math.max(kmax,10)*1.3);
  let pmin=1/n;
  if(avg) for(const d in avg.h) pmin=Math.min(pmin,avg.h[d]/n);
  const lymin=Math.floor(Math.log10(Math.max(pmin,1e-7)))-0.2, lymax=0.15;

  const X=k=>ml+pw*Math.log10(k)/lxmax;
  const Y=p=>mt+ph*(lymax-Math.log10(p))/(lymax-lymin);

  pctx.strokeStyle=T.grid; pctx.fillStyle=T.txt;
  pctx.font='15px '+FONT; pctx.textAlign='center'; pctx.lineWidth=1;
  pctx.strokeRect(ml,mt,pw,ph);
  for(let e=0;e<=Math.ceil(lxmax);e++){
    const k=Math.pow(10,e); if(Math.log10(k)>lxmax) break;
    const x=X(k);
    pctx.beginPath(); pctx.moveTo(x,mt); pctx.lineTo(x,mt+ph); pctx.stroke();
    pctx.fillText(e===0?'1':'10'+sup(e), x, hp-24);
  }
  pctx.textAlign='right';
  for(let e=0;e>=Math.floor(lymin);e--){
    const p=Math.pow(10,e); if(Math.log10(p)<lymin) continue;
    const y=Y(p);
    pctx.beginPath(); pctx.moveTo(ml,y); pctx.lineTo(ml+pw,y); pctx.stroke();
    pctx.fillText(e===0?'1':'10'+sup(e), ml-6, y+5);
  }
  pctx.textAlign='center';
  pctx.fillText('degree k', ml+pw/2, hp-5);
  pctx.save(); pctx.translate(17,mt+ph/2); pctx.rotate(-Math.PI/2);
  pctx.fillText('P(k)',0,0); pctx.restore();

  let fit=null;
  if(avg){
    // time-averaged: line + dots
    const ks=Object.keys(avg.h).map(Number).sort((a,b)=>a-b);
    pctx.strokeStyle=T.avg; pctx.lineWidth=1.4; pctx.beginPath();
    ks.forEach((k,i)=>{ const x=X(k), y=Y(avg.h[k]/n);
      i?pctx.lineTo(x,y):pctx.moveTo(x,y); });
    pctx.stroke();
    pctx.fillStyle=T.avg;
    for(const k of ks){ pctx.beginPath(); pctx.arc(X(k),Y(avg.h[k]/n),1.8,0,7); pctx.fill(); }

    // dashed power-law fit, k in [5, kmax/10)
    fit=fitPowerLaw(avg,n);
    if(fit){
      const k1=fit.lo, k2=avg.mx;                 // draw across full tail
      const p1=Math.exp(fit.icpt+fit.slope*Math.log(k1));
      const p2=Math.exp(fit.icpt+fit.slope*Math.log(k2));
      pctx.strokeStyle=T.fit; pctx.lineWidth=1.3;
      pctx.setLineDash([7,5]);
      pctx.beginPath(); pctx.moveTo(X(k1),Y(p1)); pctx.lineTo(X(k2),Y(p2)); pctx.stroke();
      pctx.setLineDash([]);
      const km=Math.sqrt(k1*k2), pm=Math.exp(fit.icpt+fit.slope*Math.log(km));
      pctx.fillStyle=T.fit; pctx.font='18px '+FONT; pctx.textAlign='left';
      pctx.fillText('P(k) ∝ k^'+fit.slope.toFixed(2), X(km)+12, Y(pm)-10);
      pctx.font='15px '+FONT;
    }
  }
  document.getElementById('stFit').textContent =
    fit ? 'P(k) ∝ k^'+fit.slope.toFixed(2) : '–';

  // current: blue circles
  pctx.strokeStyle=T.cur; pctx.lineWidth=1.4;
  for(const d in cur.h){
    pctx.beginPath(); pctx.arc(X(+d), Y(cur.h[d]/n), 3, 0, 7); pctx.stroke();
  }
  // legend, stacked in the lower left
  pctx.textAlign='left'; pctx.font='16px '+FONT;
  const lx=ml+16, dyl=26;
  let ly=mt+ph-16;
  pctx.strokeStyle=T.fit; pctx.setLineDash([5,4]); pctx.lineWidth=1.3;
  pctx.beginPath(); pctx.moveTo(lx,ly-5); pctx.lineTo(lx+24,ly-5); pctx.stroke();
  pctx.setLineDash([]);
  pctx.fillStyle=T.leg; pctx.fillText('power-law fit (5 ≤ k < kₘₐₓ/10)', lx+32, ly);
  ly-=dyl;
  pctx.fillStyle=T.avg; pctx.fillRect(lx, ly-9, 24, 4);
  pctx.fillStyle=T.leg; pctx.fillText('time-avg (last 3/4)', lx+32, ly);
  ly-=dyl;
  pctx.strokeStyle=T.cur; pctx.lineWidth=1.4;
  pctx.beginPath(); pctx.arc(lx+12, ly-6, 4, 0, 7); pctx.stroke();
  pctx.fillStyle=T.leg; pctx.fillText('current P(k)', lx+32, ly);

  /* ===== right half: traces of the 3 largest degrees vs time ===== */
  pctx.save();
  if(stacked) pctx.translate(-hw, hp);
  const ml2=hw+58, mr2=16;
  const pw2=(stacked?w+hw:w)-ml2-mr2, ph2=ph;
  pctx.strokeStyle=T.grid; pctx.lineWidth=1;
  pctx.strokeRect(ml2,mt,pw2,ph2);

  // collect data for the selected window
  let xs=null, y1=null, y2=null, y3=null, t0=0, t1=1;
  if(traceMode===0 && trAll1.length>1){
    y1=trAll1; y2=trAll2; y3=trAll3;
    xs=i=>(i+0.5)*trStride; t0=0; t1=Math.max(step,1);
  }else if(traceMode===1 && ringLen>1){
    y1=[]; y2=[]; y3=[];
    for(let i=0;i<ringLen;i++){
      const idx=(ringPos-ringLen+i+ringSize)%ringSize;
      y1.push(ring1[idx]); y2.push(ring2[idx]); y3.push(ring3[idx]);
    }
    xs=i=>step-ringLen+i+1; t0=step-ringLen+1; t1=Math.max(step,t0+1);
  }
  if(y1 && y1.length>1){
    let km2=1;
    for(let i=0;i<y1.length;i++) km2=Math.max(km2,y1[i]);
    km2*=1.08;
    const Xt=t=>ml2+pw2*(t-t0)/(t1-t0);
    const Yt=v=>mt+ph2*(1-v/km2);
    // y gridlines + labels
    pctx.font='15px '+FONT; pctx.fillStyle=T.txt; pctx.textAlign='right';
    const yt=niceStep(km2);
    for(let v=yt; v<km2; v+=yt){
      pctx.strokeStyle=T.grid;
      pctx.beginPath(); pctx.moveTo(ml2,Yt(v)); pctx.lineTo(ml2+pw2,Yt(v)); pctx.stroke();
      pctx.fillText(v, ml2-6, Yt(v)+5);
    }
    // x labels
    pctx.textAlign='center';
    pctx.fillText(Math.round(t0), ml2+8, hp-24);
    pctx.fillText(Math.round((t0+t1)/2), ml2+pw2/2, hp-24);
    pctx.fillText(Math.round(t1), ml2+pw2-14, hp-24);
    pctx.fillText('time (steps)', ml2+pw2/2, hp-5);
    pctx.save(); pctx.translate(hw+18,mt+ph2/2); pctx.rotate(-Math.PI/2);
    pctx.fillText('k',0,0); pctx.restore();

    const trace=(arr,col,lw2)=>{
      pctx.strokeStyle=col; pctx.lineWidth=lw2; pctx.beginPath();
      for(let i=0;i<arr.length;i++){
        const x=Xt(xs(i)), yv=Yt(arr[i]);
        i?pctx.lineTo(x,yv):pctx.moveTo(x,yv);
      }
      pctx.stroke();
    };
    // biggest node: light grey area under its curve, then its line
    pctx.fillStyle=T.k1fill;
    pctx.beginPath();
    pctx.moveTo(Xt(xs(0)), Yt(y1[0]));
    for(let i=1;i<y1.length;i++) pctx.lineTo(Xt(xs(i)), Yt(y1[i]));
    pctx.lineTo(Xt(xs(y1.length-1)), mt+ph2);
    pctx.lineTo(Xt(xs(0)), mt+ph2);
    pctx.closePath(); pctx.fill();
    trace(y1,T.k1,1.8);
    trace(y2,T.k2,1.5);
    trace(y3,T.k3,1.5);

    // legend
    pctx.textAlign='left'; pctx.font='16px '+FONT;
    let lyt=mt+22;
    pctx.fillStyle=T.k1fill; pctx.fillRect(ml2+14, lyt-12, 24, 12);
    pctx.strokeStyle=T.k1; pctx.lineWidth=1.8;
    pctx.beginPath(); pctx.moveTo(ml2+14,lyt-12); pctx.lineTo(ml2+38,lyt-12); pctx.stroke();
    pctx.fillStyle=T.leg; pctx.fillText('largest k', ml2+46, lyt);
    lyt+=24;
    pctx.strokeStyle=T.k2; pctx.lineWidth=1.5;
    pctx.beginPath(); pctx.moveTo(ml2+14,lyt-5); pctx.lineTo(ml2+38,lyt-5); pctx.stroke();
    pctx.fillStyle=T.leg; pctx.fillText('2nd largest', ml2+46, lyt);
    lyt+=24;
    pctx.strokeStyle=T.k3;
    pctx.beginPath(); pctx.moveTo(ml2+14,lyt-5); pctx.lineTo(ml2+38,lyt-5); pctx.stroke();
    pctx.fillStyle=T.leg; pctx.fillText('3rd largest', ml2+46, lyt);
  }else{
    pctx.font='15px '+FONT; pctx.fillStyle=T.txt; pctx.textAlign='center';
    pctx.fillText('collecting data…', ml2+pw2/2, mt+ph2/2);
  }

  // window switch button (top right of trace panel)
  const bw=170, bh=26, bx=ml2+pw2-bw-10, by=mt+8;
  traceBtnRect=[stacked?bx-hw:bx, stacked?by+hp:by, bw, bh];
  pctx.fillStyle=lightBg?'rgba(210,216,224,0.9)':'rgba(44,53,66,0.9)';
  pctx.strokeStyle=T.grid;
  pctx.beginPath();
  pctx.roundRect ? pctx.roundRect(bx,by,bw,bh,6) : pctx.rect(bx,by,bw,bh);
  pctx.fill(); pctx.stroke();
  pctx.fillStyle=T.leg; pctx.font='14px '+FONT; pctx.textAlign='center';
  pctx.fillText(traceMode===0 ? 'window: all time' : 'window: last 20·N steps',
                bx+bw/2, by+18);
  pctx.restore();
}
function niceStep(mx){
  const raw=mx/4;
  const p=Math.pow(10,Math.floor(Math.log10(raw)));
  for(const m of [1,2,5,10]) if(m*p>=raw) return m*p;
  return 10*p;
}
function sup(e){
  const map={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³',
             '4':'⁴','5':'⁵','6':'⁶','7':'⁷'};
  return String(e).split('').map(c=>map[c]||c).join('');
}

/* ---------- PNG export ---------- */

function withBg(src){
  const c=document.createElement('canvas');
  c.width=src.width; c.height=src.height;
  const g=c.getContext('2d');
  g.fillStyle=bgCss(); g.fillRect(0,0,c.width,c.height);
  g.drawImage(src,0,0);
  return c;
}
function download(cnv,name){
  const a=document.createElement('a');
  a.download=name;
  a.href=cnv.toDataURL('image/png');
  a.click();
}
function saveBoth(){
  drawPlot();
  const gap=8;
  const c=document.createElement('canvas');
  c.width=Math.max(netC.width,plotC.width);
  c.height=netC.height+gap+plotC.height;
  const g=c.getContext('2d');
  g.fillStyle=bgCss(); g.fillRect(0,0,c.width,c.height);
  g.drawImage(netC,0,0);
  g.drawImage(plotC,0,netC.height+gap);
  download(c,'network+histogram.png');
}

/* ================= main loop / UI ================= */

let acc=0, last=performance.now(), frame=0;
function loop(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(running && speed>0){
    acc+=dt*speed;
    let done=0;
    while(acc>=1 && done<400){ modelStep(); acc-=1; done++; }
    if(acc>=1) acc=0;
  }
  theta += dt*0.012*rotC;              // slow 3D rotation
  for(let i=0;i<3;i++) relax();
  fitView(false);
  drawNet();
  if(frame%10===0){
    drawPlot();
    let e=0; for(const nd of nodes) e+=nd.nb.size; e/=2;
    let km=0; for(const nd of nodes) km=Math.max(km,nd.nb.size);
    document.getElementById('stT').textContent=step;
    document.getElementById('stN').textContent=nodes.length;
    document.getElementById('stE').textContent=e;
    document.getElementById('stAvg').textContent=(2*e/(nodes.length||1)).toFixed(2);
    document.getElementById('stMax').textContent=km;
  }
  frame++;
  requestAnimationFrame(loop);
}

const modeBtns=[document.getElementById('m0'),document.getElementById('m1'),document.getElementById('m2')];
modeBtns.forEach((b,i)=>b.onclick=()=>{
  mode=i;
  modeBtns.forEach((x,j)=>x.classList.toggle('active',j===i));
});
document.getElementById('btnReset').onclick=()=>{
  N=Math.max(10,Math.min(2000, +document.getElementById('inN').value||800));
  K=Math.max(0.5,Math.min(10, +document.getElementById('inK').value||4));
  document.getElementById('inN').value=N; document.getElementById('inK').value=K;
  seed(); fitView(true);
};
const runBtn=document.getElementById('btnRun');
runBtn.onclick=()=>{
  running=!running;
  runBtn.classList.toggle('paused',!running);
  runBtn.innerHTML = running ? '&#9646;&#9646; Pause' : '&#9654; Run';
};
const sizeBtns=[...document.getElementById('sizeRow').children];
sizeBtns.forEach(b=>b.onclick=()=>{
  sizeMult=+b.dataset.s;
  sizeBtns.forEach(x=>x.classList.toggle('active',x===b));
});
const volBtn=document.getElementById('btnVol');
volBtn.onclick=()=>{
  volMode=1-volMode;
  volBtn.innerHTML = volMode ? 'Volume &prop; &radic;k' : 'Volume &prop; k';
};
const glowBtn=document.getElementById('btnGlow');
glowBtn.onclick=()=>{
  glowOn=!glowOn;
  if(!glowOn) glows=[];
  glowBtn.textContent = glowOn ? 'Afterglow: ON' : 'Afterglow: OFF';
  glowBtn.classList.toggle('active',glowOn);
};
const bgBtn=document.getElementById('btnBg');
bgBtn.onclick=()=>{
  lightBg=!lightBg;
  bgBtn.textContent = lightBg ? 'Background: WHITE' : 'Background: BLACK';
  bgBtn.classList.toggle('active',lightBg);
  document.getElementById('netbox').style.background=bgCss();
  document.getElementById('plotbox').style.background=bgCss();
};
document.getElementById('btnPngNet').onclick=()=>download(withBg(netC),'network.png');
document.getElementById('btnPngPlot').onclick=()=>{ drawPlot(); download(withBg(plotC),'histogram.png'); };
document.getElementById('btnPngBoth').onclick=saveBoth;
/* click on the plot toggles the trace window */
plotC.addEventListener('click',e=>{
  const r=plotC.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  if(x>=traceBtnRect[0] && x<=traceBtnRect[0]+traceBtnRect[2] &&
     y>=traceBtnRect[1] && y<=traceBtnRect[1]+traceBtnRect[3]){
    traceMode=1-traceMode;
    drawPlot();
  }
});
/* speed slider: 0-50 -> 0-100/s linear, 50-100 -> 100-10000/s exponential */
function speedOf(v){
  return v<=50 ? 2*v : 100*Math.pow(100,(v-50)/50);
}
function bindSlider(id,vid,fn,fmt){
  const s=document.getElementById(id), v=document.getElementById(vid);
  const up=()=>{ fn(+s.value); v.textContent=fmt(+s.value); };
  s.oninput=up; up();
}
bindSlider('sSpeed','vSpeed',x=>speed=speedOf(x),x=>Math.round(speedOf(x))+' /s');
bindSlider('sRep','vRep',x=>repC=x,x=>x);
bindSlider('sAng','vAng',x=>angC=x,x=>x);
bindSlider('sDamp','vDamp',x=>dampC=x,x=>x);
bindSlider('sRot','vRot',x=>rotC=x,x=>x);
bindSlider('sLw','vLw',x=>lwC=x,x=>x+'%');
bindSlider('sTr','vTr',x=>trC=x,x=>x+'%');

resize();
seed();
fitView(true);
requestAnimationFrame(loop);
